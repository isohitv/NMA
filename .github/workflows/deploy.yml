name: Build and deploy Net Mon App

on:
  push:
    branches:
      - main
      - agents/whats-new-in-the-project
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build renderer and backend
        run: npm run build
      - name: Prepare Pages artifact
        run: cp dist/renderer/index.html dist/renderer/404.html
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: net-mon-app-backend
          path: |
            dist/server
            package.json
            package-lock.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/renderer

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
